[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tools-lab"
version = "0.1.0"
description = "Seven local Python tools, one MCP server, and a friendly place to contribute."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
mcp-tools-lab = "mcp_tools_lab.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
