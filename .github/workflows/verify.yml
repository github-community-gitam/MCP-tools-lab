# MCP Tools Lab — verify
#
# Unlike the Python challenge repo, nothing here is broken on purpose. All
# seven tools already work, and contributors ADD features with tests. So the
# rule is simple: the whole test suite must stay green across the selected
# Python versions and on Windows.
#
# Every step is a command a contributor can run on their own machine, so a red
# check is always reproducible locally:
#     python -m pytest -q
#     python examples/try_tools.py
#     python .github/scripts/check_rules.py origin/main
name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Let every combination finish, so a contributor sees "fails only on
      # Windows" instead of one red job and cancelled ones.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.10" }   # oldest in requires-python
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        # tests/test_server.py launches the real MCP server and calls every
        # tool over stdio, so a stray print() or a broken registration fails here.
        run: python -m pytest -q

      - name: Run the example script
        run: python examples/try_tools.py

      - name: How to reproduce a failure
        if: failure()
        shell: bash
        run: |
          echo "::error::The test suite failed. Reproduce it locally with:"
          echo "    python -m pip install -e \".[dev]\""
          echo "    python -m pytest -q"
          echo "The first FAILED line above names the test and the assert that broke."

  house-rules:
    name: house rules (no print, no network, PR shape)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff against the base branch
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Blocking: print()/stdout writes and network imports anywhere in src/.
      # Warnings only: tool changed without tests or docs, more than one tool
      # module changed, pyproject.toml changed. Warnings show as annotations on
      # the "Files changed" tab but never turn the check red.
      - name: Check house rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          if [ -n "$base" ]; then
            python .github/scripts/check_rules.py "$base"
          else
            python .github/scripts/check_rules.py
          fi
